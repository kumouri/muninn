; Muninn firmware — PlatformIO
; Portable logic lives in lib/ (muninn_proto, muninn_dsp) so it builds & tests on the host.
; Hardware code lives in src/ and is compiled only for the device env.

[platformio]
default_envs = esp32-s3
src_dir = src
lib_dir = lib
test_dir = test

[env]
build_flags = -std=gnu++17 -Wall
lib_ldf_mode = deep+

; ── v1: ESP32-S3 + PCM1808 stereo line-in tap ─────────────────────────────────
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1            ; hardware CDC over native USB (the USB-CDC transport)
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi   ; enable 8 MB PSRAM (N16R8)
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    fastled/FastLED @ ^3.7.0        ; status LED

; ── Same board, Wi-Fi + SD store-and-forward transport (M2) ───────────────────
[env:esp32-s3-wifi]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DMUNINN_TRANSPORT=1            ; MUNINN_TRANSPORT_WIFI_TCP (with SD store-and-forward)

; ── Same board, stereo diarization tap (M3b) ──────────────────────────────────
[env:esp32-s3-stereo]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DMUNINN_STEREO_TAP=1          ; send program (L) + voice (R) for listener diarization

; ── ORIGINAL ESP32 (Classic BT): A2DP sink capturing the B03+ mixer mix (M4) ───
; Different chip from the S3 envs above — the S3 has no Classic Bluetooth.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -DMUNINN_FRONTEND=1            ; MUNINN_FRONTEND_A2DP_SINK
board_build.partitions = huge_app.csv   ; the BT stack + app won't fit the default partition
monitor_speed = 115200
lib_deps =
    fastled/FastLED @ ^3.7.0
    pschatzmann/ESP32-A2DP @ ^1.8.0   ; A2DP sink (Classic BT)

; ── Host unit tests (pure lib/ modules only) ──────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DMUNINN_NATIVE=1
build_src_filter = -<*>             ; do not compile src/ (hardware) on the host
