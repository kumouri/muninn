name: CI

# Git Flow: integrate on develop, release on main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Host unit tests (DSP + protocol)
        working-directory: firmware
        run: pio test -e native
      - name: Build firmware (ESP32-S3; USB, Wi-Fi/SD, stereo)
        working-directory: firmware
        run: pio run -e esp32-s3 -e esp32-s3-wifi -e esp32-s3-stereo

  listener:
    name: listener (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./listener[dev]"
      - name: Ruff lint
        run: ruff check listener tools
      - name: Ruff format check
        run: ruff format --check listener tools
      - name: Pytest
        working-directory: listener
        run: pytest -q
